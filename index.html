<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>체험단 일정</title>
<meta name="theme-color" content="#1E6F5C">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}

/* 레이아웃: 영수증/티켓 스텁 카드 세로 목록. 왼쪽은 가게 정보, 오른쪽 점선 너머는 D-day. 하단 고정 추가 버튼과 바텀시트 입력. */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --ink:#18201C; --muted:#66716B; --line:#D3DAD2;
  --accent:#1E6F5C; --accent-ink:#FFFFFF; --soft:#DCEBE4; --soft-ink:#165445;
  --urgent:#C0352B; --urgent-soft:#F8E1DE; --warn:#9A5A08; --warn-soft:#F6E8CF;
  --done:#7B8680;
  --f-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1A211D; --ink:#E8EEEA; --muted:#93A09A; --line:#2D3832;
    --accent:#5CC4A4; --accent-ink:#0B1A14; --soft:#1F3A31; --soft-ink:#8EDCC3;
    --urgent:#FF7B6E; --urgent-soft:#3A1F1C; --warn:#E3A64B; --warn-soft:#38290F;
    --done:#6C7771; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --ink:#E8EEEA; --muted:#93A09A; --line:#2D3832;
  --accent:#5CC4A4; --accent-ink:#0B1A14; --soft:#1F3A31; --soft-ink:#8EDCC3;
  --urgent:#FF7B6E; --urgent-soft:#3A1F1C; --warn:#E3A64B; --warn-soft:#38290F;
  --done:#6C7771; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin-inline:auto;padding-inline:16px;padding-block:20px 112px}

.top{display:flex;flex-direction:column;gap:2px;margin-bottom:16px}
.date{margin:0;font-size:13px;color:var(--muted)}
h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.2;letter-spacing:.01em}
.sum{margin:4px 0 0;font-size:14px}
.sync{margin:0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud::before{background:var(--accent)}

.bar{display:flex;gap:8px;margin-bottom:14px;align-items:stretch}
.seg{display:flex;flex:1;min-width:0;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;min-height:38px;font-size:14px;font-weight:500;color:var(--muted);padding:0 6px;white-space:nowrap}
.seg button b{font-family:var(--f-mono);font-weight:500;font-size:12px;margin-left:2px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
#pf{max-width:42%;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:0 10px;font-size:14px;min-height:44px}

.list{display:flex;flex-direction:column;gap:12px}
.ticket{--st-bg:var(--soft);--st-fg:var(--soft-ink);display:grid;grid-template-columns:minmax(0,1fr) 92px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket.is-soon{--st-bg:var(--warn-soft);--st-fg:var(--warn)}
.ticket.is-urgent,.ticket.is-late{--st-bg:var(--urgent-soft);--st-fg:var(--urgent)}
.ticket.is-done{--st-bg:var(--bg);--st-fg:var(--done)}
.ticket.is-done .main{opacity:.62}
.main{padding:14px 14px 12px;min-width:0;display:flex;flex-direction:column;gap:7px}
.row1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;background:var(--soft);color:var(--soft-ink);border-radius:6px;padding:2px 8px}
.ex{font-size:11px;font-weight:700;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:1px 7px}
.name{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.is-done .name{text-decoration:line-through}
.offer,.memo{margin:0;font-size:14px;word-break:keep-all;overflow-wrap:anywhere}
.memo{color:var(--muted);font-size:13px}
.tel-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tel{font-family:var(--f-mono);font-size:14px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-variant-numeric:tabular-nums}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;font-size:12px;padding:2px 10px;min-height:28px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:4px}
.btn{min-height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;padding:0 14px;font-size:14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700;flex:1}
.btn.danger{color:var(--urgent);border-color:var(--urgent)}
.btn.danger.armed{background:var(--urgent);color:var(--surface)}
.acts .btn{min-height:36px;font-size:13px;padding:0 12px}

.stub{position:relative;border-left:2px dashed var(--line);background:var(--st-bg);color:var(--st-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;text-align:center}
.stub::before,.stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub::before{top:-8px}
.stub::after{bottom:-8px}
.dd{font-family:var(--f-display);font-size:28px;line-height:1;white-space:nowrap}
.dt{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

.empty{border:2px dashed var(--line);border-radius:14px;padding:18px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}
.example{opacity:.78;pointer-events:none}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;min-height:54px;padding:0 22px;border:0;border-radius:27px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab span{font-size:24px;line-height:1;margin-top:-2px}

.scrim{position:fixed;inset:0;background:rgba(10,15,12,.5);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;max-width:560px;z-index:11;background:var(--surface);border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;justify-content:space-between}
.sh-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.x{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:700}
.field input[type=text],.field input[type=tel],.field input[type=date],.field textarea{width:100%;min-width:0;min-height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;font-size:16px;appearance:none;-webkit-appearance:none}
.field textarea{resize:none}
.field input:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;border:1.5px solid var(--line);background:transparent;border-radius:20px;padding:0 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.add{border-style:dashed;color:var(--muted)}
.err{margin:0;min-height:0;color:var(--urgent);font-size:13px;font-weight:500}
.err:empty{display:none}
.sh-actions{display:flex;gap:8px}
.sh-actions .btn{min-height:48px;font-size:16px}


.tag.fix{background:var(--warn-soft);color:var(--warn);border:0;cursor:pointer}
.kws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kw{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px}
.kwl{font-size:11px;color:var(--muted);align-self:center;margin-right:2px}
.kw button{border:0;background:transparent;padding:0 2px;font-size:12px;color:var(--muted);min-width:20px;min-height:20px}
.note summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--soft-ink);min-height:30px;display:flex;align-items:center}
.note p{margin:2px 0 0;white-space:pre-line;font-size:13px;word-break:keep-all;overflow-wrap:anywhere}
.photo{border:1.5px dashed var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--soft)}
.photo p{margin:0;font-size:13px;color:var(--soft-ink)}
.photo .btn{border-color:var(--accent);color:var(--soft-ink);font-weight:700;min-height:44px}
.photo .stat{min-height:0;font-weight:500}
.photo .stat:empty{display:none}
.imgs{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--urgent);border-radius:12px;padding:10px;background:var(--urgent-soft)}
.imgs .t{margin:0;font-size:13px;color:var(--urgent);font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs img{height:96px;width:auto;border-radius:8px;border:1px solid var(--line);flex:none;cursor:zoom-in}
.imgs .btn{min-height:40px;font-size:14px}
.kwrow{display:flex;gap:8px}
.kwrow input{flex:1}
.kwrow .btn{min-height:46px}
.field.miss input[type=text],.field.miss input[type=tel],.field.miss input[type=date],.field.miss textarea{border-color:var(--urgent);background:var(--urgent-soft)}
.field.miss .lb::after{content:" · 못 읽었어요. 직접 적어 주세요";color:var(--urgent);font-weight:500;font-size:12px}
.field.miss .chips{outline:1.5px solid var(--urgent);outline-offset:4px;border-radius:12px}
.zoom{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:center}
.tools .mini{min-height:36px;padding:0 14px;font-size:13px}
.hint{margin:0;font-size:13px;color:var(--muted)}
.fmt-fields{display:flex;flex-direction:column;gap:14px}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;max-width:536px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.upd button{min-height:40px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px}
.photo .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.queue{display:flex;gap:8px;overflow-x:auto;padding-block:2px}
.qi{position:relative;flex:none}
.qi img{height:72px;width:auto;border-radius:8px;border:1px solid var(--line);display:block}
.qi button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:12px;padding:0}
</style>
</head>
<body>


<div class="upd" id="upd" role="status" hidden><span>새 버전이 있어요</span><button type="button" id="upd-btn">업데이트</button></div>
<main>
  <header class="top">
    <p class="date" id="today"></p>
    <h1>체험단 일정</h1>
    <p class="sum" id="sum"></p>
    <p class="sync" id="sync">불러오는 중</p>
  </header>
  <div class="bar">
    <div class="seg" id="seg" role="group" aria-label="상태 필터"></div>
    <select id="pf" aria-label="플랫폼 필터" hidden></select>
  </div>
  <section class="list" id="list" aria-live="polite"></section>
  <div class="tools"><button type="button" class="mini" id="t-fmt">인식 형식</button><button type="button" class="mini" id="t-exp">백업 저장</button><button type="button" class="mini" id="t-imp">백업 불러오기</button><input id="f-imp" type="file" accept=".json,application/json" hidden></div>
</main>

<button type="button" class="fab" id="add"><span>+</span>추가</button>
<div class="scrim" id="scrim" hidden></div>

<form class="sheet" id="sheet" hidden novalidate>
  <div class="grab"></div>
  <div class="sh-head">
    <h2 id="sh-title">체험단 추가</h2>
    <button type="button" class="x" id="close" aria-label="닫기">✕</button>
  </div>
  <div class="photo" id="photo">
    <p>체험단 공고 화면을 캡처해서 올리면 이 기기에서 글자를 읽어 아래 칸을 채워요. 사진은 서버로 보내지 않고, 다 읽으면 바로 지워요.</p>
    <p>여러 장을 한 번에 고르거나, 한 장씩 계속 추가해도 돼요. 다 고른 뒤 "읽기 시작"을 누르세요.</p>
    <button type="button" class="btn" id="photo-btn">사진 올리기</button>
    <input id="f-photo" type="file" accept="image/*" multiple hidden>
    <div class="queue" id="queue" hidden></div>
    <button type="button" class="btn primary" id="photo-go" hidden>읽기 시작</button>
    <p class="stat" id="stat" role="status"></p>
    <button type="button" class="btn" id="photo-stop" hidden>읽기 취소</button>
    <p id="tplnote"></p>
  </div>
  <div class="imgs" id="imgs" hidden>
    <p class="t">못 읽은 항목이 있어요. 사진을 보고 빨간 칸을 직접 적어 주세요.</p>
    <div class="thumbs" id="thumbs"></div>
    <button type="button" class="btn" id="imgs-del">✕ 다 적었어요. 사진 지우기</button>
  </div>
  <div class="field" id="w-store"><label class="lb" for="f-store">체험단 가게 이름</label>
    <input id="f-store" type="text" autocomplete="off" maxlength="60"></div>
  <div class="field" id="w-offer"><label class="lb" for="f-offer">제공 내역</label>
    <textarea id="f-offer" rows="2" maxlength="300"></textarea></div>
  <div class="field" id="w-deadline"><label class="lb" for="f-date">마감일</label>
    <input id="f-date" type="date"></div>
  <div class="field" id="w-phone"><label class="lb" for="f-phone">연락처</label>
    <input id="f-phone" type="tel" inputmode="tel" autocomplete="off"></div>
  <div class="field" id="w-platform"><span class="lbl lb" id="plat-lbl">체험단 플랫폼</span>
    <div class="chips" id="plats" role="group" aria-labelledby="plat-lbl"></div>
    <input id="f-custom" type="text" maxlength="20" aria-label="플랫폼 이름" hidden></div>
  <div class="field" id="w-keywords"><label class="lb" for="f-kw">필수 키워드</label>
    <div class="kwrow"><input id="f-kw" type="text" autocomplete="off" maxlength="40"><button type="button" class="btn" id="kw-add">추가</button></div>
    <div class="kws" id="kwlist"></div></div>
  <div class="field" id="w-keywords2"><label class="lb" for="f-kw2">선택 키워드 (선택)</label>
    <div class="kwrow"><input id="f-kw2" type="text" autocomplete="off" maxlength="40"><button type="button" class="btn" id="kw-add2">추가</button></div>
    <div class="kws" id="kwlist2"></div></div>
  <div class="field" id="w-notice"><label class="lb" for="f-notice">예약 유의사항</label>
    <textarea id="f-notice" rows="5" maxlength="1500"></textarea></div>
  <div class="field"><label for="f-memo">메모 (선택)</label>
    <textarea id="f-memo" rows="2" maxlength="200"></textarea></div>
  <p class="err" id="err" role="alert"></p>
  <div class="sh-actions">
    <button type="button" class="btn danger" id="del" hidden>삭제</button>
    <button type="submit" class="btn primary">저장</button>
  </div>
</form>
<form class="sheet" id="fmt" hidden novalidate>
  <div class="grab"></div>
  <div class="sh-head"><h2>인식 형식</h2><button type="button" class="x" id="fmt-close" aria-label="닫기">✕</button></div>
  <p class="hint">플랫폼마다 항목 제목이 다르면 여기에 적어 두세요. 사진을 읽을 때 이 제목을 찾아서 아래 내용을 가져와요. 여러 개는 쉼표로 나눠요.</p>
  <div class="chips" id="fmt-plats" role="group" aria-label="플랫폼 선택"></div>
  <div id="fmt-fields" class="fmt-fields">
    <div class="field"><label for="fx-offer">제공 내역 제목</label><input id="fx-offer" type="text" autocomplete="off"></div>
    <div class="field"><label for="fx-phone">연락처 제목</label><input id="fx-phone" type="text" autocomplete="off"></div>
    <div class="field"><label for="fx-keywords">필수 키워드 제목</label><input id="fx-keywords" type="text" autocomplete="off"></div>
    <div class="field"><label for="fx-notice">예약 유의사항 제목</label><input id="fx-notice" type="text" autocomplete="off"></div>
  </div>
  <div class="sh-actions"><button type="submit" class="btn primary">저장</button></div>
</form>
<div class="zoom" id="zoom" hidden><img id="zoom-img" alt="확대한 사진"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>


<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="app.js"></script>
</body>
</html>
